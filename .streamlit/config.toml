[theme]
# The main accent color (Soft Neon Genesis Pink/Red)
primaryColor = "#FF6B8B"

# The main background (Deep, dark desaturated plum/magenta)
backgroundColor = "#3a2230"

# The sidebar and input boxes (Slightly lighter dark pink-grey)
secondaryBackgroundColor = "#470d2f"

# The text color (A very soft, readable blush-white)
textColor = "#FFE8EE"

# The font style
font = "serif"