[theme]
# A subtle, muted slate-blue for buttons (looks professional, not flashy)
primaryColor = "#5C7C8A"

# The main background: A very soft, warm off-white (like your VS Code)
backgroundColor = "#F8F6F0"

# The sidebar: A very slightly darker warm-grey/beige to create depth
secondaryBackgroundColor = "#EFEBE0"

# Text: Soft dark charcoal (easier on the eyes than pure black)
textColor = "#3A3836"

# Serif font gives it that authentic, readable physics textbook feel
font = "serif"