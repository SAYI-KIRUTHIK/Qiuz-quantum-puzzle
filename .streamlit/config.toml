[theme]
# The main accent color (used for the 'Primary' buttons and loading bars)
primaryColor = "#bbf3e0" 

# The main background color of the app (Deep space dark blue/grey)
backgroundColor = "#d8d3c4"

# The background of the sidebar and input boxes (Slightly lighter)
secondaryBackgroundColor = "#eee8d5"

# The color of the text
textColor = "#FFFFFF"

# The font style (Options: "sans serif", "serif", or "monospace")
font = "serif"